server:
  port: 8081

spring:
  application:
    name: hotel-booking-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/hotel_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:hotel_user}
    password: ${DB_PASSWORD:hotel_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always
      continue-on-error: true

jwt:
  secret: ${JWT_SECRET:change-this-secret-for-production}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    org.springframework.security: INFO
    com.hotelbooking: INFO
